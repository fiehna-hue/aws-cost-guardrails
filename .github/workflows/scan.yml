name: scan

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::247906201098:role/aws-cost-guardrails-scan
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan every region for billable resources
        run: python3 scan.py --all-regions
